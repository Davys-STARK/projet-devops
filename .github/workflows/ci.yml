name: CI-CD

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Nom en minuscules
        id: nom
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: ghcr.io/${{ steps.nom.outputs.owner }}/mon-appli:latest

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Deployer le conteneur
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE=ghcr.io/$OWNER/mon-appli:latest
          for i in 1 2 3 4 5 6 7 8; do
            docker pull $IMAGE && break
            echo "essai $i echoue"
            if [ $i -eq 8 ]; then exit 1; fi
            sleep 10
          done
          docker rm -f appli || true
          docker run -d -p 8080:8080 --name appli --restart unless-stopped $IMAGE