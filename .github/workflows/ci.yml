deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Deployer le conteneur
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE=ghcr.io/$OWNER/mon-appli:latest
          for i in 1 2 3 4 5 6 7 8; do
            docker pull $IMAGE && break
            echo "essai $i echoue"
            if [ $i -eq 8 ]; then exit 1; fi
            sleep 10
          done
          docker rm -f appli || true
          docker run -d -p 8080:8080 --name appli --restart unless-stopped $IMAGE